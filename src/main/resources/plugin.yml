name: SHCron
version: '${project.version}'
main: org.Cry_Legende.sHCron.bukkit.SHCronBukkit
# 1.13 est un minimum, pas un maximum : le meme jar tourne sur Paper 1.18.2
# comme sur les Purpur recents, tant que les API utilisees existent encore.
api-version: '1.13'
author: Cry_Legende
description: Planificateur de commandes (remplace MC-Cron)
folia-supported: false
# Optionnel. Present -> les placeholders des commandes sont resolus en contexte
# serveur, comme le faisait SRV-Cron. Absent -> les commandes partent telles quelles.
softdepend: [PlaceholderAPI]

commands:
  shcron:
    description: Gestion des taches planifiees
    usage: /shcron <list|reload|run>

permissions:
  shcron.admin:
    description: Toute l'administration de SHCron
    default: op
    children:
      shcron.admin.list: true
      shcron.admin.reload: true
      shcron.admin.run: true
  shcron.admin.list:
    description: Lister les taches planifiees
    default: op
  shcron.admin.reload:
    description: Recharger config.yml et messages.yml
    default: op
  shcron.admin.run:
    description: Declencher une tache a la demande
    default: op
