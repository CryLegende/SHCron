# ======================================================================== #
# SHCron
#
# Plugin : planificateur de commandes exécutées par la console, au format cron. Le même jar tourne sur Paper/Purpur
# et sur Velocity (sur Velocity la commande d'arrêt est "end", sur Paper "stop").
#
# Commande (alias : aucun) :
#   /shcron list      Liste les tâches (état, expression cron, nombre de commandes).
#   /shcron run <t>   Déclenche la tâche <t> tout de suite.
#   /shcron reload    Relit ce fichier et messages.yml. Un fichier illisible ne change rien : les tâches en place
#                     continuent. Les tâches ignorées (cron invalide, aucune commande) sont listées dans la réponse.
#                     La liste startup n'est pas rejouée, et les commandes "+N" ou "wait:" déjà programmées par une
#                     tâche en cours se terminent avec l'ancienne liste.
#
# Permissions (par défaut : op) :
#   shcron.admin          Toutes les sous-commandes.
#   shcron.admin.list     /shcron list
#   shcron.admin.reload   /shcron reload
#   shcron.admin.run      /shcron run
# Sur Velocity ces nœuds ne se déclarent pas et le parent ne donne pas ses enfants : accorder shcron.admin ou le
# nœud précis dans LuckPerms.
#
# Les textes sont dans messages.yml.
#
# timezone : fuseau des expressions cron (vide : fuseau du système).
# log-executions : écrire chaque commande exécutée dans la console.
# startup : commandes lancées une fois au démarrage, après delay-seconds.
# jobs.<nom> : enabled, cron, commands. "cron: manual" : tâche sans horaire, lancée seulement par /shcron run.
#
# cron : minute heure jour-du-mois mois jour-de-la-semaine
#   *          toutes les valeurs        5          la valeur 5          1-5   de 1 à 5
#   */4        une valeur sur 4          1-20/2     de 1 à 20, une sur deux       0,30   les valeurs 0 et 30
#   jour-de-la-semaine : 0 ou 7 = dimanche, 1 = lundi ... 6 = samedi, ou MON, TUE...
#   mois : 1-12 ou JAN, FEB...
#   Raccourcis : @hourly @daily @midnight @weekly @monthly @yearly
#   "*/4" en jour du mois donne le 1, 5, 9, ... 29 puis repart au 1 du mois suivant.
#
# commands : le "/" en début de commande est facultatif.
#   "+N commande"  Décalage absolu de N secondes depuis le déclenchement de la tâche, en parallèle des autres lignes.
#   "wait: N"      Pause de N secondes avant la suite de la liste (cumulative). Ne pas mélanger avec les "+N".
#   "until N: A == B"  Attend que la condition soit vraie avant la suite, N secondes au plus : passé ce délai, la suite
#                  part quand même. Relue chaque seconde, placeholders résolus des deux côtés. Opérateurs : == != < <= > >=
#                  (deux nombres sont comparés en nombres ; sinon seuls == et != comparent le texte, sans la casse).
#                  Exemple : "until 400: %crazyenvoys_envoys_left% == 0". Sur Velocity, il n'y a pas de placeholders.
#   Les placeholders PlaceholderAPI (%shvotesreward_...%) sont résolus.
# ======================================================================== #

timezone: Europe/Paris
log-executions: true
startup:
  enabled: true
  delay-seconds: 15
  commands:
  - crazyenvoys reload
jobs:
  redemarrage:
    enabled: true
    cron: 55 5 * * *
    commands:
    - bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &e5 minutes
    - tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &e5 minutes
    - +2 tm abroadcast &dRedémarrage quotidien dans &e5 minutes
    - +6 tm abroadcast &7&l« &7Le &dredémarrage &7ne prend que &51 minute MAX &8&l»
    - +30 tm abroadcast &dRedémarrage quotidien dans &e5 minutes
    - +35 tm abroadcast &7&l« &7Le &dredémarrage &7ne prend que &51 minute MAX &8&l»
    - +60 tm abroadcast &dRedémarrage quotidien dans &e4 minutes
    - +65 tm abroadcast &7&l« &7Le &dredémarrage &7ne prend que &51 minute MAX &8&l»
    - +120 tm abroadcast &dRedémarrage quotidien dans &e3 minutes
    - +125 tm abroadcast &7&l« &7Le &dredémarrage &7ne prend que &51 minute MAX &8&l»
    - +180 tm abroadcast &dRedémarrage quotidien dans &e2 minutes
    - +185 tm abroadcast &7&l« &7Le &dredémarrage &7ne prend que &51 minute MAX &8&l»
    - +240 bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &c1 minute
    - +240 tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &61 &dminute
    - +290 bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &c10 secondes
    - +290 tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &c10 secondes
    - +290 save-all
    - +290 irp forcebackup all
    - +295 bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &c5 secondes
    - +295 tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &c5 secondes
    - +296 bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &44 secondes
    - +296 tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &44 secondes
    - +297 bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &43 secondes
    - +297 tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &43 secondes
    - +298 bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &42 secondes
    - +298 tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &42 secondes
    - +299 bc &7&l« &d&lSH &8&l» &dRedémarrage automatique des SkyBlock dans &41 seconde
    - +299 tm broadcast &7&l« &5&lAttention &8&l»\n&dRedémarrage automatique dans &41 seconde
    - +300 kickall Redémarrage du SkyBlock &6Opale&f, veuillez patienter environ &650 secondes&f...
    - +302 stop
  envoy:
    enabled: true
    cron: 25 18 * * *
    commands:
    - 'bc &7&l« &d&lSH &8&l» &fUn évènement &dCargaison &fcommencera dans &d5 minutes &f!\n&7🔎 &fᴏʙᴊᴇᴄᴛɪꜰ : &7ᴄᴏʟʟᴇᴄᴛᴇᴢ ʟᴇ ᴘʟᴜѕ ᴅᴇ ᴄᴀʀɢᴀɪѕᴏɴ [/event]'
  envoy2:
    enabled: true
    cron: 29 18 * * *
    commands:
    - 'bc &7&l« &d&lSH &8&l» &fUn évènement &dCargaison &fcommencera dans &d1 minute &f!\n&7🔎 &fᴏʙᴊᴇᴄᴛɪꜰ : &7ᴄᴏʟʟᴇᴄᴛᴇᴢ ʟᴇ ᴘʟᴜѕ ᴅᴇ ᴄᴀʀɢᴀɪѕᴏɴ [/event]'
  cargaison-double:
    enabled: true
    cron: manual
    commands:
    - crazyenvoys start
    - 'wait: 20'
    - 'until 400: %crazyenvoys_envoys_left% == 0'
    - 'bc &7&l« &d&lSH &8&l» &fDouble &dCargaison &f: la deuxième commence dans &d1 minute &f!\n&7🔎 &fᴏʙᴊᴇᴄᴛɪꜰ : &7ᴄᴏʟʟᴇᴄᴛᴇᴢ ʟᴇ ᴘʟᴜѕ ᴅᴇ ᴄᴀʀɢᴀɪѕᴏɴ [/event]'
    - 'wait: 60'
    - crazyenvoys start
  topvote:
    enabled: true
    cron: 59 23 * * *
    commands:
    - bc &7&l« &a&lSH &8&l» &a%shvotesreward_top_daily_name_1% &fa été &aTop voteur du jour &favec &6%shvotesreward_top_daily_votes_1% votes &f!
